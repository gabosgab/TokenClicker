<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Clicker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <main class="layout">
        <section class="panel main-panel">
          <div class="main-panel-header">
<div class="main-panel-counts">
              <strong id="tokenCount">0</strong>
              <div class="main-panel-rate">
                <span>Tokens Per Second:</span>
                <strong id="tpsCount">0</strong>
              </div>
            </div>
          </div>

          <div class="prompt-stage">
            <canvas id="promptBackdrop" class="prompt-backdrop" aria-hidden="true"></canvas>
            <div class="prompt-stage-glow" aria-hidden="true"></div>
            <button id="promptButton" class="prompt-button" type="button">
              <span class="button-title">Run Prompt</span>
              <span class="button-subtitle">Press Enter or click</span>
            </button>
          </div>

          <section class="trend-card" aria-label="Token production over the last 5 minutes">
            <div class="trend-card-header">
              <div>
                <p class="eyebrow">5-minute production</p>
                <strong id="trendValue" class="trend-value">0</strong>
              </div>
              <span class="trend-caption">Tokens produced</span>
            </div>

            <div id="trendBars" class="trend-bars" aria-hidden="true"></div>

            <div class="trend-scale">
              <span>5m ago</span>
              <span>now</span>
            </div>
          </section>

          <section class="owned-powerups">
            <div class="owned-powerups-header">
              <span class="manual-boost-label">Active boosts</span>
              <span class="owned-powerups-note">Purchased one-time powerups</span>
            </div>
            <div id="ownedPowerupIcons" class="effect-icons owned-powerup-icons"></div>
          </section>

          <div class="main-panel-footer">
            <div class="simple-copy">
              <p>Manual prompt yield: <strong id="manualYield">1</strong></p>
              <p>Total prompts: <strong id="promptCount">0</strong></p>
              <p>Total earned: <strong id="earnedCount">0</strong></p>
            </div>

            <div class="footer-actions">
              <button id="saveButton" class="small-button" type="button">Save</button>
              <button id="resetButton" class="small-button danger" type="button">
                Reset
              </button>
            </div>
            <div id="debugActions" class="footer-actions" hidden>
              <button id="debug1M" class="small-button" type="button">+1M tokens</button>
              <button id="debug100M" class="small-button" type="button">+100M tokens</button>
            </div>
            <p id="saveStatus" class="save-status">
              Local save active. Progress is stored in this browser.
            </p>
          </div>
        </section>

        <section class="panel scene-panel">
          <div id="newsCard" class="news-card" hidden>
            <div id="newsAvatar" class="news-avatar" data-account=""></div>
            <div class="news-body">
              <span id="newsHandle" class="news-handle"></span>
              <p id="newsText" class="news-text"></p>
            </div>
          </div>

          <div id="sceneList" class="scene-list"></div>
        </section>

        <aside class="panel shop-panel">
          <section class="powerup-dock">
            <div class="powerup-dock-header">
              <p class="eyebrow">Upgrades for sale</p>
              <span class="powerup-dock-note">Hover for details</span>
            </div>
            <div id="powerupList" class="powerup-list"></div>
          </section>


          <div id="entityList" class="entity-list"></div>
        </aside>
      </main>
    </div>

    <div id="powerupTooltip" class="powerup-tooltip" hidden>
      <p id="powerupHoverName" class="powerup-hover-name"></p>
      <p id="powerupHoverEffect" class="powerup-hover-effect"></p>
      <p id="powerupHoverDescription" class="powerup-hover-description"></p>
      <p id="powerupHoverCost" class="powerup-hover-cost"></p>
    </div>

    <div id="entityTooltip" class="entity-tooltip" hidden>
      <div class="entity-tooltip-head">
        <div class="entity-tooltip-title-wrap">
          <div id="entityHoverIcon" class="entity-tooltip-icon"></div>
          <div>
            <p id="entityHoverName" class="entity-tooltip-name"></p>
            <p id="entityHoverOwned" class="entity-tooltip-owned"></p>
          </div>
        </div>
        <p id="entityHoverCost" class="entity-tooltip-cost"></p>
      </div>
      <p id="entityHoverDescription" class="entity-tooltip-description"></p>
      <div class="entity-tooltip-stats">
        <p id="entityHoverUnitRate" class="entity-tooltip-stat"></p>
        <p id="entityHoverTotalRate" class="entity-tooltip-stat"></p>
        <p id="entityHoverLifetime" class="entity-tooltip-stat"></p>
      </div>
    </div>

    <script src="./news.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
